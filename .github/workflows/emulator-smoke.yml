name: emulator-smoke

# Boots an Android emulator, installs the debug APK, taps every calculator
# button and captures logcat. Manual: Actions -> emulator-smoke -> Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Wizig CLI
        run: |
          set -euo pipefail
          NAME=wizig-nightly-20261023-c768ed10-linux-x86_64
          BASE="https://github.com/wizig-org/wizig/releases/download/nightly-20261023"
          curl -fsSL -o "/tmp/$NAME.tar.gz" "$BASE/$NAME.tar.gz"
          curl -fsSL -o "/tmp/$NAME.tar.gz.sha256" "$BASE/$NAME.tar.gz.sha256"
          (cd /tmp && sha256sum -c "$NAME.tar.gz.sha256")
          tar -xzf "/tmp/$NAME.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$NAME/bin" >> "$GITHUB_PATH"

      - name: Generate bindings and build debug APK
        run: |
          wizig codegen . --allow-toolchain-drift
          (cd android && ./gradlew :app:assembleDebug --no-daemon --console=plain)

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and exercise every calculator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: sh .github/smoke.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            logcat-full.txt
            crash.txt
            targets.txt
          if-no-files-found: ignore
